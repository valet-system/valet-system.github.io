project_id = "valet-system"

# ═══════════════════════════════════════════════════════════════════════
# EDGE FUNCTIONS
#
# verify_jwt controls whether SUPABASE'S GATEWAY checks the JWT before our
# code runs at all.
# ═══════════════════════════════════════════════════════════════════════

[functions.admin-users]
# verify_jwt = false — and this is deliberate, not a shortcut.
#
# WHY: a browser does NOT send the Authorization header on a CORS preflight.
# That is per spec — preflights are deliberately credential-free. So with
# verify_jwt = true the gateway can reject the OPTIONS request for having no
# token, and the browser reports it as:
#
#   "Response to preflight request doesn't pass access control check:
#    It does not have HTTP ok status"
#
# which reads like a CORS bug and sends you hunting through response headers
# that are already correct.
#
# THE FUNCTION STILL VERIFIES THE JWT ITSELF. identifyCaller() in
# _shared/caller.ts calls admin.auth.getUser(jwt), which asks GoTrue to check
# the token's SIGNATURE server-side, then reads the caller's role from the
# database. An unauthenticated request reaches our code and is answered with
# 401 immediately.
#
# >>> If you ever edit admin-users, identifyCaller() MUST stay as the first
# >>> thing every action does. With verify_jwt = false it is the ONLY thing
# >>> standing between this endpoint and the internet.
verify_jwt = false


[functions.push-send]
# verify_jwt = false, and this is what makes push work at all.
#
# push-send is called by a DATABASE WEBHOOK on push_outbox INSERT. A webhook is
# Postgres talking to an HTTP endpoint — there is no signed-in user anywhere in
# that path, so there is no user JWT to send. With verification left on, every
# webhook call is rejected 401 before our code runs, the row stays 'queued', and
# no phone is ever told. The app looks like it works, because a notification
# still appears while the page is alive — that one comes from the PAGE, not from
# push. The failure only shows up once the app is closed, which is the exact
# case push exists for.
#
# The Ambria Admin app hit this and documents the same fix:
#   supabase functions deploy send-push --no-verify-jwt
#
# WHAT THIS EXPOSES, AND WHY IT IS ACCEPTABLE
#   Anyone can now POST to this endpoint. All they can make it do is deliver
#   messages that are ALREADY queued, to the devices those messages were already
#   addressed to. It accepts no input — it reads the queue and reports counts.
#   There is nothing to leak and nothing to inject.
verify_jwt = false


# ── Not built yet. Listed so the intent is recorded. ──────────────────

[functions.wa-send]
# Called from the browser, so the same preflight reasoning applies. It will
# verify the caller in code.
verify_jwt = false

[functions.wa-webhook]
# Meta calls this server-to-server. Meta has no Supabase JWT, so verification
# must be off — there is no alternative here. Authenticity is proven instead by
# the X-Hub-Signature-256 HMAC, which the function checks before doing anything
# with the payload.
verify_jwt = false

[functions.wa-dispatch]
# Drains public.wa_outbox. Invoked by a scheduler, not by a user.
verify_jwt = false

[functions.valet-report]
# Read-only analytics for Ambria Admin, which is a DIFFERENT Supabase project.
# Its users' JWTs are signed by that project, so this project's gateway would
# reject every one of them as invalid — verification here could only ever fail.
#
# Authenticity is proven instead by X-API-Key, which the function compares
# against REPORT_API_KEY in constant time before it touches the database. An
# unset secret refuses everything rather than waving it through.
#
# Note it sends NO CORS headers, deliberately: a browser must not be able to
# call this, because the key would then have to live in a public bundle.
verify_jwt = false

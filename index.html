<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!--
      viewport-fit=cover  -> lets us pad around the iPhone notch and home
                             indicator using env(safe-area-inset-*) in CSS.
      No maximum-scale     -> pinch-zoom stays available. Blocking it is an
                             accessibility failure, and iOS ignores it anyway.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>Ambria Valet</title>
    <meta name="description" content="Valet parking management for Ambria properties." />

    <!-- Colours the phone's status bar / browser chrome to match the app bar. -->
    <!-- theme-color is per-theme too: the phone's status bar should match the
         chrome it sits above. The dark value is the same near-black the light
         theme uses for the chrome, so one value serves both. -->
    <meta name="theme-color" content="#0b0b0c" />

    <!--
      ── APPLIED BEFORE THE FIRST PAINT, ON PURPOSE ──────────────────
      Blocking and inline, in <head>, ahead of any stylesheet or bundle.
      src/utils/theme.js does the same job for the running app, but nothing
      in a module can run before the browser paints — so without these few
      lines somebody on dark gets one full frame of white page on every
      cold load, which reads as the app flickering.

      Deliberately duplicated logic, deliberately tiny: same storage key,
      same fallback. If you change the key, change it in utils/theme.js too.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('valet-theme')
          var dark =
            stored === 'dark' ||
            (stored !== 'light' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>

    <!-- ── PWA ────────────────────────────────────────────────────────
         The manifest is what makes the app installable. iOS Safari still
         ignores most of it, so the apple-* tags below repeat the same
         information in the form iOS understands.
    -->
    <link rel="manifest" href="/manifest.json" />

    <meta name="mobile-web-app-capable" content="yes" />
    <!-- iOS: run without Safari's chrome when launched from the home screen. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ambria Valet" />

    <!-- ── icons ──────────────────────────────────────────────────────
         All generated by `npm run logo && npm run icons` from the brand
         lockup in brand/ambria-logo.png — gold car above the AMBRIA
         wordmark, with its black background keyed out by luminance.

         NO SVG LINK, deliberately. There used to be one, listed FIRST,
         and browsers that accept SVG prefer it — so the old hand-drawn
         car glyph in favicon.svg would have kept showing in the tab while
         every other icon showed the new brand. The brand arrived as a
         raster; two sources for one logo is how they drift apart.

         Two sizes so a high-DPI tab and a pinned tab both get pixels
         rather than an upscaled 32.
    -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="180x180" href="/favicon-180.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Internal ops tool: keep it out of search results entirely. -->
    <meta name="robots" content="noindex, nofollow" />
  </head>

  <body>
    <div id="root"></div>

    <!--
      No-JS fallback. This app cannot work without JavaScript, so say so
      plainly instead of presenting a blank white page.
    -->
    <noscript>
      <div style="font-family: system-ui, sans-serif; padding: 2rem; text-align: center">
        <h1 style="font-size: 1.125rem">JavaScript is required</h1>
        <p style="color: #475569">Please enable JavaScript to use Ambria Valet.</p>
      </div>
    </noscript>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
